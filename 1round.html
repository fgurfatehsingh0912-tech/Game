<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="1style.css">
</head>
<body>
    <div class="game-container">
        <h1>Rock Paper Scissors</h1>
        
        <div class="scoreboard">
            <div class="score-box">
                <span class="label">Player</span>
                <span id="player-score" class="score">0</span>
            </div>
            <div class="score-box">
                <span class="label">Computer</span>
                <span id="computer-score" class="score">0</span>
            </div>
        </div>

        <div class="battlefield">
            <div class="side">
                <h3>You Picked</h3>
                <div id="player-reveal" class="reveal-box"></div>
            </div>
            <div class="countdown-zone">
                <div id="countdown-number" class="countdown-text"></div>
                <div id="vs-text" class="vs">VS</div>
            </div>
            <div class="side">
                <h3>Computer Picked</h3>
                <div id="computer-reveal" class="reveal-box"></div>
            </div>
        </div>

        <div class="result-message" id="game-result">Choose your move to battle!</div>

        <div class="choices">
            <button class="choice-btn" data-choice="rock">✊<span class="tooltip">Rock</span></button>
            <button class="choice-btn" data-choice="paper">✋<span class="tooltip">Paper</span></button>
            <button class="choice-btn" data-choice="scissors">✌️<span class="tooltip">Scissors</span></button>
        </div>
    </div>
    <script src="1script.js"></script>
</body>
</html>
